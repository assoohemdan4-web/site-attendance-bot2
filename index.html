<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Site Attendance • Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand-mark">SA</div>
    <p class="eyebrow">SITE ATTENDANCE</p>
    <h1>Attendance Management System</h1>
    <p class="muted">A lightweight accountant and employee portal built for the site's real attendance workflow.</p>

    <form id="loginForm" class="form-grid">
      <label>Role
        <select id="role">
          <option value="accountant">Accountant</option>
          <option value="employee">Employee</option>
        </select>
      </label>

      <label id="userLabel">Username
        <input id="username" value="accountant" autocomplete="username">
      </label>

      <label>Password
        <input id="password" type="password" value="1234" autocomplete="current-password">
      </label>

      <button class="primary" type="submit">Enter portal</button>
      <p id="loginMsg" class="message"></p>
    </form>

    <div class="demo-box">
      <strong>Prototype access</strong>
      <div>Accountant: <code>accountant / 1234</code></div>
      <div>Employee: choose Employee, code <code>7636</code>, password <code>1234</code></div>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
